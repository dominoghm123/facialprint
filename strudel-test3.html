<!DOCTYPE html>
<html>
<body>
<button id="btn">Start Strudel</button>
<script type="module">
  import { evalCode, getAudioContext } from 'https://cdn.skypack.dev/@strudel/web';
  document.getElementById('btn').addEventListener('click', async () => {
    await getAudioContext().resume();
    await evalCode(`
samples('https://strudel.cc/samples')
$:sound("jazz:0 circuitsdrumtracks_bd:0")
    `);
    console.log("evaluated");
  });
</script>
</body>
</html>
