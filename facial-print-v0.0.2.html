<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FACIAL PRINT · V0.0.2</title>
<style>
/* ── RESET ── */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#fff}
canvas{display:block;position:fixed;top:0;left:0}

/* ── TOP BAR ── */
#topbar{position:fixed;top:0;left:0;right:0;height:38px;display:flex;align-items:center;
  padding:0 16px;z-index:20;pointer-events:none}
#logo{font-size:12px;letter-spacing:0.18em;opacity:0.72;pointer-events:auto;
  text-decoration:none;color:#fff}
#logo:hover{opacity:1}
#title-block{position:absolute;left:50%;transform:translateX(-50%);text-align:center;line-height:1}
#title-main{font-size:11px;letter-spacing:0.28em;opacity:0.85}
#title-sub{font-size:9px;letter-spacing:0.22em;opacity:0.42;margin-top:2px}

/* ── PARAMS STATUS BADGE ── */
#params-badge{position:fixed;top:10px;right:16px;font-size:9px;letter-spacing:0.14em;
  padding:3px 8px;border:1px solid rgba(255,255,255,0.18);border-radius:2px;
  opacity:0.55;z-index:20;transition:opacity 0.4s,color 0.4s,border-color 0.4s}
#params-badge.ok{color:#7fff7f;border-color:rgba(127,255,127,0.35)}
#params-badge.err{color:#ff7f7f;border-color:rgba(255,127,127,0.35)}
#params-badge.pulse{opacity:1}

/* ── STYLE SWITCHER (left) ── */
#switcher{position:fixed;left:14px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:8px;z-index:20}
.sw-btn{position:relative;background:none;border:none;
  color:rgba(255,255,255,0.32);font-family:'Courier New',monospace;
  font-size:9px;letter-spacing:0.18em;cursor:pointer;
  padding:4px 0 4px 18px;text-align:left;transition:color 0.3s}
.sw-btn:hover{color:rgba(255,255,255,0.75)}
.sw-btn.active{color:#fff}
.sw-btn.t-sel{color:rgba(255,255,255,0.88)}
.triple-badge{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:13px;height:13px;border-radius:50%;
  background:rgba(255,255,255,0.9);color:#000;font-size:7px;font-weight:700;
  display:none;align-items:center;justify-content:center;line-height:1}
.sw-btn.t-sel .triple-badge{display:flex}

/* ── CAPTURE PANEL (right) ── */
#capture-wrap{position:fixed;right:20px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:10px;z-index:20}
#capture-btn{width:46px;height:46px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,0.5);background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color 0.25s,transform 0.15s,opacity 0.3s,box-shadow 0.5s}
#capture-btn:hover{border-color:#fff;transform:scale(1.08)}
#capture-btn:active{transform:scale(0.93)}
#capture-btn svg{opacity:0.7}
#capture-btn.inactive{opacity:0.2;cursor:default;pointer-events:none}
#capture-btn.triple-ready{
  border-color:rgba(255,255,255,0.92);
  animation:tripleGlow 2s ease-in-out infinite}
@keyframes tripleGlow{
  0%,100%{box-shadow:0 0 10px rgba(255,255,255,0.14),0 0 26px rgba(255,255,255,0.06)}
  50%{box-shadow:0 0 22px rgba(255,255,255,0.40),0 0 52px rgba(255,255,255,0.14)}}
#triple-progress{
  font-size:8px;letter-spacing:0.10em;opacity:0.45;
  text-align:center;display:none;line-height:1.75;pointer-events:none;
  min-height:42px}
#capture-wrap.triple-mode #triple-progress{display:block}
#mode-toggle{font-size:8px;letter-spacing:0.18em;opacity:0.38;cursor:pointer;
  user-select:none;transition:color 0.2s,opacity 0.2s}
#mode-toggle:hover{opacity:0.72}
#mode-toggle.triple-on{color:#fff;opacity:0.72}

/* ── SOUND ── */
#sound-btn{position:fixed;bottom:22px;right:20px;font-size:10px;letter-spacing:0.20em;
  background:none;border:none;color:rgba(255,255,255,0.36);cursor:pointer;z-index:20;
  font-family:'Courier New',monospace;transition:color 0.2s}
#sound-btn:hover{color:rgba(255,255,255,0.8)}

/* ── FOOTER ── */
#footer{position:fixed;bottom:10px;left:0;right:0;text-align:center;
  font-size:9px;letter-spacing:0.16em;opacity:0.28;z-index:20;pointer-events:none}

/* ── FLASH ── */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50;
  transition:opacity 0.06s}

/* ════════════════════════════════════
   COUNTDOWN OVERLAY
════════════════════════════════════ */
#countdown-overlay{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,0.54);z-index:80;
  opacity:0;pointer-events:none;transition:opacity 0.35s}
#countdown-overlay.active{opacity:1}
#cd-shot-lbl{font-size:10px;letter-spacing:0.38em;opacity:0.46;margin-bottom:12px}
#cd-num{
  font-size:min(30vw,220px);line-height:1;letter-spacing:-0.04em;color:#fff;opacity:0}
#cd-num.pop{animation:numPop 0.92s cubic-bezier(0.25,0.46,0.45,0.94) forwards}
@keyframes numPop{
  0%  {opacity:0;transform:scale(1.6)}
  18% {opacity:1}
  78% {opacity:0.9;transform:scale(1.0)}
  100%{opacity:0;transform:scale(0.82)}}
#cd-style-lbl{font-size:9px;letter-spacing:0.24em;opacity:0.32;margin-top:18px}

/* ════════════════════════════════════
   FILMSTRIP OVERLAY
════════════════════════════════════ */
#filmstrip-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:90;
  display:flex;flex-direction:column;align-items:center;
  overflow-y:auto;padding:44px 20px 72px;
  opacity:0;pointer-events:none;transition:opacity 0.5s}
#filmstrip-overlay.active{opacity:1;pointer-events:auto}

/* The strip container */
#film-strip{
  background:#0f0f0f;max-width:min(540px,92vw);width:100%;
  border:1px solid rgba(255,255,255,0.06);overflow:hidden;
  box-shadow:0 8px 120px rgba(0,0,0,0.95)}

/* Top / bottom edge rows (horizontal sprocket dots) */
.film-edge-row{
  height:42px;background:#0c0c0c;
  display:flex;align-items:center;justify-content:space-evenly;padding:0 10px}
.film-dot{width:9px;height:9px;border-radius:50%;background:#050505;flex-shrink:0}

/* Separator row between frames */
.film-sep-row{
  height:34px;background:#0c0c0c;
  display:flex;align-items:center;justify-content:space-evenly;padding:0 10px}

/* Each frame row (perf | image | perf) */
.film-frame-row{display:flex;align-items:stretch;background:#000}

/* Sprocket perforation columns */
.film-perf-col{
  flex-shrink:0;width:26px;background:#0c0c0c;
  display:flex;flex-direction:column;
  align-items:center;justify-content:space-evenly;padding:8px 0}
.film-perf-hole{
  width:13px;height:9px;background:#050505;border-radius:1px;flex-shrink:0}

/* Image area */
.film-image-col{flex:1;background:#000;display:block}
.film-image-col canvas{display:block;width:100%;height:auto}

/* Style label row below each frame */
.film-label-row{
  background:#111;padding:7px 26px;
  display:flex;align-items:center;justify-content:space-between}
.film-label-num{font-size:9px;letter-spacing:0.16em;color:rgba(255,255,255,0.22)}
.film-label-style{font-size:9px;letter-spacing:0.22em;color:rgba(255,255,255,0.48)}

/* Action buttons */
#film-actions{margin-top:28px;display:flex;gap:14px;align-items:center}
#film-dl-btn{
  font-family:'Courier New',monospace;font-size:10px;letter-spacing:0.24em;
  background:none;border:1px solid rgba(255,255,255,0.42);color:#fff;
  padding:10px 26px;cursor:pointer;transition:all 0.22s}
#film-dl-btn:hover{border-color:#fff;background:rgba(255,255,255,0.05)}
#film-close-btn{
  font-family:'Courier New',monospace;font-size:10px;letter-spacing:0.20em;
  background:none;border:none;color:rgba(255,255,255,0.30);
  cursor:pointer;padding:10px;transition:color 0.2s}
#film-close-btn:hover{color:#fff}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="flash"></div>

<!-- TOP BAR -->
<div id="topbar">
  <a id="logo" href="https://www.qcdomino.space/" target="_blank" rel="noopener">QCDOMINO</a>
  <div id="title-block">
    <div id="title-main">FACIAL PRINT</div>
    <div id="title-sub">INK · DISSOLVED</div>
  </div>
</div>

<!-- PARAMS STATUS -->
<div id="params-badge">PARAMS ···</div>

<!-- STYLE SWITCHER -->
<div id="switcher"></div>

<!-- CAPTURE PANEL -->
<div id="capture-wrap">
  <button id="capture-btn" title="Capture">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.4">
      <circle cx="9" cy="9" r="5.5"/>
      <circle cx="9" cy="9" r="2.2" fill="#fff" stroke="none"/>
    </svg>
  </button>
  <div id="triple-progress"></div>
  <div id="mode-toggle">SINGLE</div>
</div>

<!-- SOUND -->
<button id="sound-btn">SOUND OFF</button>

<!-- FOOTER -->
<div id="footer">© 2026 Qicheng Dai. All Rights Reserved.</div>

<!-- COUNTDOWN OVERLAY -->
<div id="countdown-overlay">
  <div id="cd-shot-lbl">SHOT 1 / 3</div>
  <div id="cd-num">3</div>
  <div id="cd-style-lbl">INK · DISSOLVED</div>
</div>

<!-- FILMSTRIP OVERLAY -->
<div id="filmstrip-overlay">
  <div id="film-strip"></div>
  <div id="film-actions">
    <button id="film-dl-btn">↓ SAVE FILMSTRIP</button>
    <button id="film-close-btn">✕ CLOSE</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
<script>
'use strict';

// ════════════════════════════════════════════════════════════════════════════
//  CFG — live-overwritten by parseMD() every ~1.5 s
// ════════════════════════════════════════════════════════════════════════════
var CFG = {
  SAT_BASE:7, SAT_SH:12,
  DENSITY_K:0.041, DENSITY_L0:90,
  SP_BASE:2, SP_SH:4, SPREAD_CLAMP:4,
  RADIUS_MAX:4.2, RADIUS_EXP:1.4, RADIUS_THRESHOLD:0.12,
  SPRING:0.007, DAMPING:0.968,
  DRIFT_AMP:0.008, DRIFT_SPEED:0.003, DRIFT_RADIUS:16,
  FRAME_H:1.08, FRAME_W:0.82,
  HAIR_THR:-0.38, HAIR_STR:0.82,
  NECK_THR:0.40,  NECK_STR:0.38,
  EDGE_THR:0.38,  EDGE_STR:0.35,
  TRAIL:0.22
};

// ════════════════════════════════════════════════════════════════════════════
//  MARKDOWN PARAM PARSER
// ════════════════════════════════════════════════════════════════════════════
function parseMD(text) {
  var result = {}, lines = text.split('\n');
  for (var i = 0; i < lines.length; i++) {
    var m = lines[i].match(/^\|\s*([A-Z][A-Z0-9_]+)\s*\|\s*(-?[\d.]+)\s*\|/);
    if (m) result[m[1]] = parseFloat(m[2]);
  }
  return result;
}
function applyParams(incoming) {
  var needRebuild = false;
  var rebuildKeys = [
    'SAT_BASE','SAT_SH','DENSITY_K','DENSITY_L0',
    'SP_BASE','SP_SH','SPREAD_CLAMP',
    'RADIUS_MAX','RADIUS_EXP','RADIUS_THRESHOLD',
    'FRAME_H','FRAME_W',
    'HAIR_THR','HAIR_STR','NECK_THR','NECK_STR','EDGE_THR','EDGE_STR'
  ];
  for (var k in incoming) {
    if (typeof CFG[k] !== 'undefined' && CFG[k] !== incoming[k]) {
      if (rebuildKeys.indexOf(k) !== -1) needRebuild = true;
      CFG[k] = incoming[k];
    }
  }
  if (needRebuild && lastLandmarks) buildParticles(lastLandmarks);
}

// ════════════════════════════════════════════════════════════════════════════
//  PARAMS HOT-RELOAD
// ════════════════════════════════════════════════════════════════════════════
var badge = document.getElementById('params-badge');
var lastParamText = '';
var paramPollInterval = null;

function flashBadge(cls, txt) {
  badge.className = cls + ' pulse';
  badge.textContent = txt;
  clearTimeout(badge._t);
  badge._t = setTimeout(function(){ badge.classList.remove('pulse'); }, 800);
}
function fetchParams() {
  fetch('./facial-print-params.md?t=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(txt){
      if (txt !== lastParamText) {
        lastParamText = txt;
        var parsed = parseMD(txt);
        if (Object.keys(parsed).length > 0) {
          applyParams(parsed);
          flashBadge('ok','PARAMS UPDATED ✓');
        } else {
          flashBadge('err','PARSE ERROR');
        }
      } else {
        badge.className = 'ok';
        badge.textContent = 'PARAMS LIVE';
      }
    })
    .catch(function(e){
      badge.className = 'err';
      badge.textContent = 'PARAMS — '+(e.message||'OFFLINE');
    });
}
function startPolling() {
  fetchParams();
  paramPollInterval = setInterval(fetchParams, 1500);
}
document.addEventListener('visibilitychange', function(){
  clearInterval(paramPollInterval);
  paramPollInterval = setInterval(fetchParams, document.hidden ? 5000 : 1500);
});

// ════════════════════════════════════════════════════════════════════════════
//  STYLES  (color functions only; all dynamics from CFG)
// ════════════════════════════════════════════════════════════════════════════
var STYLES = [
  { name:'INK',    sub:'DISSOLVED',
    hFn:function(s){return 212+s*16;}, sFn:function(s){return 5+s*18;},  lFn:function(s){return 4+s*76;},
    glow:false, fiber:false },
  { name:'DUST',   sub:'SCATTERED',
    hFn:function(s){return 30+s*10;},  sFn:function(s){return 8+s*22;},  lFn:function(s){return 6+s*74;},
    glow:false, fiber:false },
  { name:'AMBER',  sub:'BURNING',
    hFn:function(s){return 28+s*14;},  sFn:function(s){return 55+s*30;}, lFn:function(s){return 6+s*70;},
    glow:true,  fiber:false },
  { name:'AURORA', sub:'RADIANT',
    hFn:function(s){return 160+s*80;}, sFn:function(s){return 35+s*50;}, lFn:function(s){return 5+s*72;},
    glow:true,  fiber:false },
  { name:'VELVET', sub:'DENSE',
    hFn:function(s){return 270+s*20;}, sFn:function(s){return 18+s*35;}, lFn:function(s){return 4+s*68;},
    glow:false, fiber:true }
];
var curStyle = 0, prevStyle = 0, styleBlend = 1;

// ════════════════════════════════════════════════════════════════════════════
//  CANVAS / FRAME RECT
// ════════════════════════════════════════════════════════════════════════════
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W, H, FR = {};

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  var fh = H * CFG.FRAME_H, fw = fh * CFG.FRAME_W;
  FR = { x:(W-fw)*0.5, y:(H-fh)*0.5, w:fw, h:fh };
}
window.addEventListener('resize', function(){ resize(); if(lastLandmarks) buildParticles(lastLandmarks); });

// ════════════════════════════════════════════════════════════════════════════
//  PARTICLE CLASS
// ════════════════════════════════════════════════════════════════════════════
function Particle(tx,ty,shadow,dx,dy,lmIdx,ox,oy) {
  this.tx=tx; this.ty=ty;
  this.x=tx+(Math.random()-0.5)*FR.w*0.04;
  this.y=ty+(Math.random()-0.5)*FR.h*0.04;
  this.vx=0; this.vy=0;
  this.shadow=shadow; this.dx=dx; this.dy=dy;
  this.phase=Math.random()*Math.PI*2;
  this.lmIdx=lmIdx; this.ox=ox; this.oy=oy;
}
Particle.prototype.update = function() {
  var ddx=this.tx-this.x, ddy=this.ty-this.y;
  this.vx=(this.vx+ddx*CFG.SPRING)*CFG.DAMPING;
  this.vy=(this.vy+ddy*CFG.SPRING)*CFG.DAMPING;
  if (ddx*ddx+ddy*ddy < CFG.DRIFT_RADIUS*CFG.DRIFT_RADIUS)
    this.vy += Math.sin(frame*CFG.DRIFT_SPEED+this.phase)*CFG.DRIFT_AMP;
  this.x+=this.vx; this.y+=this.vy;
};

// ════════════════════════════════════════════════════════════════════════════
//  STYLE PROPERTIES
// ════════════════════════════════════════════════════════════════════════════
function computeStyleProps(p, si) {
  var st=STYLES[si], sh=p.shadow, dx=p.dx, dy=p.dy;
  var hair = dy<CFG.HAIR_THR ? Math.min(1,(-dy-Math.abs(CFG.HAIR_THR))*2.8) : 0;
  var neck = dy>CFG.NECK_THR ? Math.min(1,(dy-CFG.NECK_THR)*2.5) : 0;
  var edge = Math.max(0,Math.abs(dx)-CFG.EDGE_THR)*2.2;
  var shEff = sh*Math.max(0.06,1-hair*CFG.HAIR_STR-neck*CFG.NECK_STR-edge*CFG.EDGE_STR);
  if (shEff < CFG.RADIUS_THRESHOLD) return null;
  var sz = CFG.RADIUS_MAX*Math.pow(shEff,CFG.RADIUS_EXP);
  var a  = 0.22+shEff*0.55;
  return { h:st.hFn(shEff), s:st.sFn(shEff), l:st.lFn(shEff),
           sz:sz, a:a, glow:st.glow, fiber:st.fiber, rot:dx*0.65 };
}
function lerpProps(pA, pB, t) {
  if (!pA) return pB; if (!pB) return pA;
  var ot=1-t;
  return { h:pA.h*ot+pB.h*t, s:pA.s*ot+pB.s*t, l:pA.l*ot+pB.l*t,
           sz:pA.sz*ot+pB.sz*t, a:pA.a*ot+pB.a*t,
           glow:pB.glow, fiber:pB.fiber, rot:pA.rot*ot+pB.rot*t };
}

// ════════════════════════════════════════════════════════════════════════════
//  PARTICLE ARRAY
// ════════════════════════════════════════════════════════════════════════════
var particles = [], lastLandmarks = null;

function buildParticles(lms) {
  particles = [];
  for (var i = 0; i < lms.length; i++) {
    var lm=lms[i];
    var baseTx=FR.x+lm.x*FR.w, baseTy=FR.y+lm.y*FR.h;
    var shadow=Math.max(0,Math.min(1,0.5-lm.z*4.5));
    var L=shadow*255;
    var density=1/(1+Math.exp(-CFG.DENSITY_K*(L-CFG.DENSITY_L0)));
    if (Math.random()>density) continue;
    var dx=lm.x*2-1, dy=lm.y*2-1;
    var count=Math.round(CFG.SAT_BASE+shadow*CFG.SAT_SH);
    var sp=CFG.SP_BASE+shadow*CFG.SP_SH;
    for (var j=0;j<count;j++){
      var r=Math.sqrt(Math.random())*Math.min(sp,CFG.SPREAD_CLAMP);
      var ang=Math.random()*Math.PI*2;
      var ox=Math.cos(ang)*r, oy=Math.sin(ang)*r;
      particles.push(new Particle(baseTx+ox, baseTy+oy, shadow, dx, dy, i, ox, oy));
    }
  }
}

function updateParticleTargets(lms) {
  for (var i=0; i<particles.length; i++) {
    var p=particles[i];
    var lm=lms[p.lmIdx];
    if (!lm) continue;
    var baseTx=FR.x+lm.x*FR.w, baseTy=FR.y+lm.y*FR.h;
    p.tx=baseTx+p.ox;
    p.ty=baseTy+p.oy;
    p.shadow=Math.max(0,Math.min(1,0.5-lm.z*4.5));
    p.dx=lm.x*2-1; p.dy=lm.y*2-1;
  }
}

// ════════════════════════════════════════════════════════════════════════════
//  RENDER LOOP
// ════════════════════════════════════════════════════════════════════════════
var frame = 0;
function draw() {
  requestAnimationFrame(draw);
  frame++;
  ctx.fillStyle='rgba(0,0,0,'+CFG.TRAIL+')';
  ctx.fillRect(0,0,W,H);
  if (video.readyState>=2) {
    ctx.save();
    ctx.globalAlpha=0.55;
    ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();
    ctx.drawImage(video, FR.x, FR.y, FR.w, FR.h);
    ctx.restore();
  }
  if (styleBlend<1) styleBlend=Math.min(1,styleBlend+0.05);
  for (var i=0;i<particles.length;i++) {
    var p=particles[i];
    p.update();
    var pC=computeStyleProps(p,curStyle);
    var pP=computeStyleProps(p,prevStyle);
    var props=styleBlend>=1?pC:lerpProps(pP,pC,styleBlend);
    if (!props||props.sz<0.2) continue;
    ctx.save();
    ctx.translate(p.x,p.y);
    if (props.fiber) ctx.rotate(props.rot);
    if (props.glow){
      ctx.shadowBlur=props.sz*3.5;
      ctx.shadowColor='hsla('+props.h+','+props.s+'%,'+(props.l+22)+'%,0.6)';
    }
    if (props.fiber){
      ctx.beginPath();
      ctx.ellipse(0,0,props.sz*0.45,props.sz*1.7,0,0,Math.PI*2);
    } else {
      ctx.beginPath();
      ctx.arc(0,0,props.sz,0,Math.PI*2);
    }
    ctx.fillStyle='hsla('+props.h+','+props.s+'%,'+props.l+'%,'+props.a+')';
    ctx.fill();
    ctx.restore();
  }
}

// ════════════════════════════════════════════════════════════════════════════
//  STYLE SWITCHER  (dual-mode: normal switch + triple slot selection)
// ════════════════════════════════════════════════════════════════════════════
var switcher  = document.getElementById('switcher');
var titleSub  = document.getElementById('title-sub');
var captureWrap = document.getElementById('capture-wrap');
var modeTog   = document.getElementById('mode-toggle');
var tripleProgress = document.getElementById('triple-progress');

// Capture mode state
var captureMode  = 'single';   // 'single' | 'triple'
var triplePhase  = 'select';   // 'select' | 'countdown' | 'preview'
var tripleSlots  = [];          // ordered list of chosen style indices (max 3)
var tripleFrames = [];          // captured frame data {sourceCanvas, styleName, styleSub}

STYLES.forEach(function(st, idx) {
  var btn = document.createElement('button');
  btn.className = 'sw-btn' + (idx===0 ? ' active' : '');
  btn.dataset.idx = idx;

  btn.appendChild(document.createTextNode(st.name));

  var tb = document.createElement('span');
  tb.className = 'triple-badge';
  btn.appendChild(tb);

  btn.addEventListener('click', function() {
    var i = parseInt(this.dataset.idx);
    if (captureMode === 'single') {
      // ── Normal style switch ──
      if (curStyle === i) return;
      prevStyle=curStyle; curStyle=i; styleBlend=0;
      document.querySelectorAll('.sw-btn').forEach(function(b){ b.classList.remove('active'); });
      this.classList.add('active');
      titleSub.textContent = st.name + ' · ' + st.sub;
    } else if (triplePhase === 'select') {
      // ── Triple slot toggle ──
      var pos = tripleSlots.indexOf(i);
      if (pos !== -1) {
        tripleSlots.splice(pos, 1);
      } else if (tripleSlots.length < 3) {
        tripleSlots.push(i);
      }
      updateTripleBadges();
      updateTripleProgress();
      updateCaptureBtn();
    }
    // During countdown or preview: clicks ignored
  });

  switcher.appendChild(btn);
});

function updateTripleBadges() {
  document.querySelectorAll('.sw-btn').forEach(function(btn) {
    var i = parseInt(btn.dataset.idx);
    var badge = btn.querySelector('.triple-badge');
    var pos = tripleSlots.indexOf(i);
    if (pos !== -1) {
      btn.classList.add('t-sel');
      badge.textContent = pos + 1;
    } else {
      btn.classList.remove('t-sel');
      badge.textContent = '';
    }
  });
}

function updateTripleProgress() {
  var lines = ['—','—','—'];
  for (var i = 0; i < tripleSlots.length; i++)
    lines[i] = STYLES[tripleSlots[i]].name;
  tripleProgress.innerHTML = lines.map(function(s, i) {
    return '<span style="opacity:'+(tripleSlots[i]!==undefined?'0.8':'0.25')+'">'+s+'</span>';
  }).join('<br>');
}

function updateCaptureBtn() {
  var btn = document.getElementById('capture-btn');
  if (captureMode === 'triple') {
    if (tripleSlots.length === 3 && triplePhase === 'select') {
      btn.classList.remove('inactive');
      btn.classList.add('triple-ready');
    } else {
      btn.classList.add('inactive');
      btn.classList.remove('triple-ready');
    }
  } else {
    btn.classList.remove('inactive','triple-ready');
  }
}

// ── Mode toggle ──
modeTog.addEventListener('click', function() {
  if (captureMode === 'single') {
    captureMode = 'triple';
    tripleSlots = []; tripleFrames = []; triplePhase = 'select';
    modeTog.textContent = 'TRIPLE';
    modeTog.classList.add('triple-on');
    captureWrap.classList.add('triple-mode');
    updateTripleBadges();
    updateTripleProgress();
    updateCaptureBtn();
  } else if (triplePhase !== 'countdown') {
    // Only allow mode switch when not mid-countdown
    captureMode = 'single';
    tripleSlots = []; tripleFrames = []; triplePhase = 'select';
    modeTog.textContent = 'SINGLE';
    modeTog.classList.remove('triple-on');
    captureWrap.classList.remove('triple-mode');
    updateTripleBadges();
    updateCaptureBtn();
  }
});

// ════════════════════════════════════════════════════════════════════════════
//  CAPTURE BUTTON HANDLER
// ════════════════════════════════════════════════════════════════════════════
var flashEl = document.getElementById('flash');

function doFlash(n) {
  flashEl.style.opacity='0.85';
  setTimeout(function(){ flashEl.style.opacity='0'; }, 80*n);
}

document.getElementById('capture-btn').addEventListener('click', function() {
  if (captureMode === 'single') {
    takeSingleShot();
  } else if (captureMode === 'triple' && tripleSlots.length === 3 && triplePhase === 'select') {
    startTripleSequence();
  }
});

// ── Single shot ──
function takeSingleShot() {
  doFlash(1);
  var tc=document.createElement('canvas');
  tc.width=W; tc.height=H;
  var tx=tc.getContext('2d');
  tx.drawImage(canvas,0,0);
  var imgD=tx.getImageData(0,0,W,H), d=imgD.data;
  for (var i=0;i<d.length;i+=4){ d[i]=255-d[i]; d[i+1]=255-d[i+1]; d[i+2]=255-d[i+2]; }
  for (var i=0;i<d.length;i+=4){
    var g=(Math.random()-0.5)*18;
    d[i]=Math.max(0,Math.min(255,d[i]+g));
    d[i+1]=Math.max(0,Math.min(255,d[i+1]+g));
    d[i+2]=Math.max(0,Math.min(255,d[i+2]+g));
  }
  tx.putImageData(imgD,0,0);
  var grd=tx.createRadialGradient(W/2,H/2,H*0.22,W/2,H/2,H*0.84);
  grd.addColorStop(0,'rgba(0,0,0,0)');
  grd.addColorStop(1,'rgba(8,4,0,0.66)');
  tx.fillStyle=grd; tx.fillRect(0,0,W,H);
  tc.toBlob(function(blob){
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url;
    a.download='facialprint-neg-'+Date.now()+'.jpg';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); },2000);
  },'image/jpeg',0.93);
}

// ════════════════════════════════════════════════════════════════════════════
//  TRIPLE SHOT SEQUENCE
// ════════════════════════════════════════════════════════════════════════════
function switchToStyle(styleIdx) {
  if (curStyle === styleIdx) return;
  prevStyle=curStyle; curStyle=styleIdx; styleBlend=0;
  document.querySelectorAll('.sw-btn').forEach(function(b){
    b.classList.toggle('active', parseInt(b.dataset.idx)===styleIdx);
  });
  titleSub.textContent = STYLES[styleIdx].name + ' · ' + STYLES[styleIdx].sub;
}

function startTripleSequence() {
  triplePhase='countdown';
  tripleFrames=[];
  updateCaptureBtn();
  switchToStyle(tripleSlots[0]);
  setTimeout(function(){ doShot(0); }, 700);
}

function doShot(shotIdx) {
  var shotNum  = shotIdx + 1;
  var styleIdx = tripleSlots[shotIdx];
  var cdOverlay = document.getElementById('countdown-overlay');

  document.getElementById('cd-shot-lbl').textContent = 'SHOT ' + shotNum + ' / 3';
  document.getElementById('cd-style-lbl').textContent =
    STYLES[styleIdx].name + ' · ' + STYLES[styleIdx].sub;

  cdOverlay.classList.add('active');

  runCountdown(3, function() {
    cdOverlay.classList.remove('active');
    doFlash(1);
    setTimeout(function() {
      captureFrame(shotIdx);
      if (shotIdx < 2) {
        switchToStyle(tripleSlots[shotIdx + 1]);
        setTimeout(function() { doShot(shotIdx + 1); }, 900);
      } else {
        triplePhase = 'preview';
        setTimeout(showFilmStrip, 400);
      }
    }, 120);
  });
}

function runCountdown(from, onDone) {
  var numEl = document.getElementById('cd-num');
  var n = from;
  function tick() {
    if (n <= 0) { onDone(); return; }
    numEl.textContent = n;
    numEl.classList.remove('pop');
    void numEl.offsetWidth; // force reflow to restart animation
    numEl.classList.add('pop');
    n--;
    setTimeout(tick, 960);
  }
  tick();
}

function captureFrame(shotIdx) {
  var styleIdx = tripleSlots[shotIdx];
  var tc=document.createElement('canvas');
  tc.width=W; tc.height=H;
  var tx=tc.getContext('2d');
  tx.drawImage(canvas,0,0);
  var imgD=tx.getImageData(0,0,W,H), d=imgD.data;
  // Film negative
  for (var i=0;i<d.length;i+=4){ d[i]=255-d[i]; d[i+1]=255-d[i+1]; d[i+2]=255-d[i+2]; }
  // Grain
  for (var i=0;i<d.length;i+=4){
    var g=(Math.random()-0.5)*16;
    d[i]=Math.max(0,Math.min(255,d[i]+g));
    d[i+1]=Math.max(0,Math.min(255,d[i+1]+g));
    d[i+2]=Math.max(0,Math.min(255,d[i+2]+g));
  }
  tx.putImageData(imgD,0,0);
  // Radial vignette
  var grd=tx.createRadialGradient(W/2,H/2,H*0.20,W/2,H/2,H*0.84);
  grd.addColorStop(0,'rgba(0,0,0,0)');
  grd.addColorStop(1,'rgba(8,4,0,0.66)');
  tx.fillStyle=grd; tx.fillRect(0,0,W,H);
  tripleFrames[shotIdx] = {
    sourceCanvas: tc,
    styleName: STYLES[styleIdx].name,
    styleSub:  STYLES[styleIdx].sub
  };
}

// ════════════════════════════════════════════════════════════════════════════
//  FILM STRIP DISPLAY
// ════════════════════════════════════════════════════════════════════════════
function makePerfsCol(height) {
  var col=document.createElement('div');
  col.className='film-perf-col';
  col.style.minHeight=height+'px';
  var count=Math.max(3, Math.floor(height/24));
  for (var j=0;j<count;j++){
    var h=document.createElement('div');
    h.className='film-perf-hole';
    col.appendChild(h);
  }
  return col;
}

function makeDotRow(cls) {
  var row=document.createElement('div');
  row.className=cls;
  for (var j=0;j<22;j++){
    var d=document.createElement('div');
    d.className='film-dot';
    row.appendChild(d);
  }
  return row;
}

function showFilmStrip() {
  var stripEl = document.getElementById('film-strip');
  stripEl.innerHTML = '';

  // Measure strip width (after DOM layout)
  var stripW = Math.min(540, window.innerWidth * 0.92);
  var PERF_W = 26;
  var frameW = stripW - PERF_W * 2;
  var frameH = Math.round(frameW * H / W);

  // Top edge
  stripEl.appendChild(makeDotRow('film-edge-row'));

  for (var i = 0; i < 3; i++) {
    var fd = tripleFrames[i];

    // Frame row
    var frameRow = document.createElement('div');
    frameRow.className = 'film-frame-row';

    frameRow.appendChild(makePerfsCol(frameH));

    // Image canvas
    var imgCol = document.createElement('div');
    imgCol.className = 'film-image-col';
    var fc = document.createElement('canvas');
    fc.width  = frameW;
    fc.height = frameH;
    fc.getContext('2d').drawImage(fd.sourceCanvas, 0, 0, W, H, 0, 0, frameW, frameH);
    imgCol.appendChild(fc);
    frameRow.appendChild(imgCol);

    frameRow.appendChild(makePerfsCol(frameH));
    stripEl.appendChild(frameRow);

    // Label
    var labelRow = document.createElement('div');
    labelRow.className = 'film-label-row';
    var numSpan = document.createElement('span');
    numSpan.className = 'film-label-num';
    numSpan.textContent = '0' + (i+1);
    var styleSpan = document.createElement('span');
    styleSpan.className = 'film-label-style';
    styleSpan.textContent = fd.styleName + ' · ' + fd.styleSub;
    labelRow.appendChild(numSpan);
    labelRow.appendChild(styleSpan);
    stripEl.appendChild(labelRow);

    // Separator (not after last)
    if (i < 2) stripEl.appendChild(makeDotRow('film-sep-row'));
  }

  // Bottom edge
  stripEl.appendChild(makeDotRow('film-edge-row'));

  document.getElementById('filmstrip-overlay').classList.add('active');
}

// ════════════════════════════════════════════════════════════════════════════
//  FILM STRIP DOWNLOAD  (composites all 3 frames into one file)
// ════════════════════════════════════════════════════════════════════════════
document.getElementById('film-dl-btn').addEventListener('click', downloadFilmStrip);

function downloadFilmStrip() {
  var STRIP_W = 620;
  var PERF_W  = 30;
  var FRAME_W = STRIP_W - PERF_W * 2; // 560
  var FRAME_H = Math.round(FRAME_W * H / W);
  var LABEL_H = 36;
  var SEP_H   = 42;
  var PAD_V   = 52;
  var STRIP_H = PAD_V*2 + 3*(FRAME_H+LABEL_H) + 2*SEP_H;

  var HOLE_W = 14, HOLE_H = 9, HOLE_STEP = 22;

  var dc = document.createElement('canvas');
  dc.width=STRIP_W; dc.height=STRIP_H;
  var dtx = dc.getContext('2d');

  // Base fill
  dtx.fillStyle='#0d0d0d';
  dtx.fillRect(0,0,STRIP_W,STRIP_H);

  // Draw the three frames
  for (var i=0;i<3;i++) {
    var fd = tripleFrames[i];
    var frameY = PAD_V + i*(FRAME_H+LABEL_H+SEP_H);

    // Sprocket strips
    drawSprocketColumn(dtx, 0,            frameY, PERF_W, FRAME_H, HOLE_W, HOLE_H, HOLE_STEP);
    drawSprocketColumn(dtx, STRIP_W-PERF_W, frameY, PERF_W, FRAME_H, HOLE_W, HOLE_H, HOLE_STEP);

    // Frame image
    dtx.drawImage(fd.sourceCanvas, 0,0,W,H, PERF_W, frameY, FRAME_W, FRAME_H);

    // Label band
    dtx.fillStyle='#111111';
    dtx.fillRect(0, frameY+FRAME_H, STRIP_W, LABEL_H);

    // Frame number
    dtx.font='11px "Courier New"';
    dtx.fillStyle='rgba(255,255,255,0.24)';
    dtx.textAlign='left';
    dtx.fillText('0'+(i+1), PERF_W+10, frameY+FRAME_H+23);

    // Style name
    dtx.fillStyle='rgba(255,255,255,0.54)';
    dtx.textAlign='right';
    dtx.fillText(fd.styleName+' · '+fd.styleSub, STRIP_W-PERF_W-10, frameY+FRAME_H+23);

    // Separator perf row (not after last)
    if (i<2) drawEdgeRow(dtx, 0, frameY+FRAME_H+LABEL_H, STRIP_W, SEP_H);
  }

  // Top and bottom edge rows
  drawEdgeRow(dtx, 0, 0, STRIP_W, PAD_V);
  drawEdgeRow(dtx, 0, STRIP_H-PAD_V, STRIP_W, PAD_V);

  // Side text watermark
  drawSideText(dtx, 11, STRIP_H/2, -Math.PI/2,
    'FACIAL PRINT · V0.0.2 · © 2026 QICHENG DAI');
  drawSideText(dtx, STRIP_W-11, STRIP_H/2, Math.PI/2,
    'FACIAL PRINT · V0.0.2 · © 2026 QICHENG DAI');

  // Film grain
  addDownloadGrain(dtx, STRIP_W, STRIP_H);

  dc.toBlob(function(blob){
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url;
    a.download='facialprint-triple-'+Date.now()+'.jpg';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); },3000);
  },'image/jpeg',0.93);
}

function drawSprocketColumn(dtx, x, y, w, h, holeW, holeH, step) {
  dtx.fillStyle='#0a0a0a';
  dtx.fillRect(x,y,w,h);
  var startY = y + ((h % step) * 0.5);
  for (var hy=startY; hy<y+h-holeH; hy+=step) {
    var hx = x + (w-holeW)/2;
    dtx.fillStyle='#050505';
    dtx.fillRect(hx|0, hy|0, holeW, holeH);
  }
}

function drawEdgeRow(dtx, x, y, w, h) {
  dtx.fillStyle='#0a0a0a';
  dtx.fillRect(x,y,w,h);
  var cy=y+h/2, step=22, startX=(w%step)*0.5;
  for (var hx=startX; hx<w-9; hx+=step) {
    dtx.fillStyle='#050505';
    dtx.beginPath();
    dtx.arc(hx+4.5, cy, 4.5, 0, Math.PI*2);
    dtx.fill();
  }
}

function drawSideText(dtx, x, y, angle, text) {
  dtx.save();
  dtx.translate(x,y);
  dtx.rotate(angle);
  dtx.fillStyle='rgba(255,255,255,0.10)';
  dtx.font='8px "Courier New"';
  dtx.textAlign='center';
  dtx.fillText(text,0,0);
  dtx.restore();
}

function addDownloadGrain(dtx, w, h) {
  var BLOCK=4;
  for (var py=0;py<h;py+=BLOCK) {
    for (var px=0;px<w;px+=BLOCK) {
      var g=(Math.random()-0.5)*0.055;
      if (g>0) {
        dtx.fillStyle='rgba(255,255,255,'+g+')';
        dtx.fillRect(px,py,BLOCK,BLOCK);
      }
    }
  }
}

// ── Close film strip & reset ──
document.getElementById('film-close-btn').addEventListener('click', function() {
  document.getElementById('filmstrip-overlay').classList.remove('active');
  triplePhase='select';
  tripleSlots=[];
  tripleFrames=[];
  updateTripleBadges();
  updateTripleProgress();
  updateCaptureBtn();
  // Restore first style button as active
  document.querySelectorAll('.sw-btn').forEach(function(b,i){ b.classList.toggle('active',i===curStyle); });
});

// ════════════════════════════════════════════════════════════════════════════
//  SOUND · Kalimba (symmetric head modulation)
// ════════════════════════════════════════════════════════════════════════════
var soundOn=false, AN=null, noteIdx=0, nextNoteTime=0;
var smoothYaw=0, smoothPitch=0, mouthOpen=0;
var PENTA=[523.25,587.33,659.25,783.99,880.00,1046.50];
var PAT=[0,2,4,3,2,0,1,4,2,3,5,3];

function initAudio() {
  if (AN) return;
  var ac=new(window.AudioContext||window.webkitAudioContext)();
  var masterGain=ac.createGain(); masterGain.gain.value=0.55;
  var delayNode=ac.createDelay(1.0); delayNode.delayTime.value=0.38;
  var fbGain=ac.createGain(); fbGain.gain.value=0.32;
  var reverbGain=ac.createGain(); reverbGain.gain.value=0.22;
  delayNode.connect(fbGain); fbGain.connect(delayNode);
  delayNode.connect(reverbGain); reverbGain.connect(masterGain);
  masterGain.connect(ac.destination);
  AN={ac:ac,master:masterGain,delay:delayNode,reverb:reverbGain};
}
function scheduleNote(freq,t) {
  var osc=AN.ac.createOscillator(), env=AN.ac.createGain();
  osc.type='triangle'; osc.frequency.value=freq;
  env.gain.setValueAtTime(0,t);
  env.gain.linearRampToValueAtTime(0.7,t+0.012);
  env.gain.exponentialRampToValueAtTime(0.001,t+0.55);
  osc.connect(env); env.connect(AN.master); env.connect(AN.delay);
  osc.start(t); osc.stop(t+0.56);
}
function tickKalimba() {
  if (!AN||!soundOn) return;
  var now=AN.ac.currentTime;
  if (nextNoteTime<now) nextNoteTime=now+0.05;
  while (nextNoteTime<now+0.20) {
    var headDev=Math.abs(smoothYaw)*0.26+Math.abs(smoothPitch)*0.16;
    var pitchMult=Math.pow(2,headDev*0.38);
    var freq=PENTA[PAT[noteIdx%PAT.length]]*pitchMult;
    scheduleNote(freq,nextNoteTime);
    nextNoteTime+=Math.max(0.22, 0.52*(1-mouthOpen*0.30));
    noteIdx++;
  }
  setTimeout(tickKalimba,80);
}
document.getElementById('sound-btn').addEventListener('click', function() {
  soundOn=!soundOn;
  this.textContent=soundOn?'SOUND ON':'SOUND OFF';
  if (soundOn){ initAudio(); tickKalimba(); }
});

// ════════════════════════════════════════════════════════════════════════════
//  MEDIAPIPE FACE MESH  — Camera utility handles stream (restored pattern)
// ════════════════════════════════════════════════════════════════════════════
var video=document.createElement('video');
video.setAttribute('playsinline','');
video.setAttribute('autoplay','');
video.muted=true;

function onResults(results) {
  if (!results.multiFaceLandmarks||!results.multiFaceLandmarks.length) return;
  var lms=results.multiFaceLandmarks[0];
  lastLandmarks=lms;
  if (particles.length===0) { buildParticles(lms); } else { updateParticleTargets(lms); }
  var nose=lms[1];
  var rawYaw=(nose.x-0.5)*2, rawPitch=(nose.y-0.5)*1.4;
  smoothYaw=smoothYaw*0.88+rawYaw*0.12;
  smoothPitch=smoothPitch*0.88+rawPitch*0.12;
  var topLip=lms[13], botLip=lms[14];
  mouthOpen=Math.min(1,Math.abs(topLip.y-botLip.y)*12);
}

var faceMesh=new FaceMesh({
  locateFile:function(f){
    return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/'+f;
  }
});
faceMesh.setOptions({
  maxNumFaces:1, refineLandmarks:true,
  minDetectionConfidence:0.5, minTrackingConfidence:0.5
});
faceMesh.onResults(onResults);

// Use Camera utility directly — it manages getUserMedia internally
var cam=new Camera(video,{
  onFrame:async function(){ await faceMesh.send({image:video}); },
  width:640, height:480
});
cam.start().catch(function(e){
  badge.className='err';
  badge.textContent='CAM ERROR';
  console.error('Camera start failed:',e);
});

// ════════════════════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════════════════════
resize();
draw();
startPolling();
</script>
