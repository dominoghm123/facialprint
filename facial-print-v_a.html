<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FACIAL PRINT · HALFTONE / V_A</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F2EDE3;overflow:hidden;font-family:'Courier New',monospace}
canvas{display:block;position:fixed;top:0;left:0}
video{display:none}
#bar{
  position:fixed;bottom:20px;left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:24px;
  z-index:10;pointer-events:none}
#label{font-size:9px;letter-spacing:0.32em;color:rgba(28,20,14,0.42)}
#status{font-size:9px;letter-spacing:0.20em;color:rgba(28,20,14,0.35)}
#save-btn{
  pointer-events:auto;background:none;
  border:1px solid rgba(28,20,14,0.28);
  color:rgba(28,20,14,0.55);
  font-family:'Courier New',monospace;font-size:9px;
  letter-spacing:0.22em;padding:5px 16px;cursor:pointer;
  transition:border-color 0.2s,color 0.2s}
#save-btn:hover{border-color:rgba(28,20,14,0.78);color:rgba(28,20,14,0.90)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline autoplay muted></video>
<div id="bar">
  <span id="label">HALFTONE · V_A</span>
  <span id="status">INIT</span>
  <button id="save-btn">SAVE</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script>
// ── FACE OVAL (36 boundary landmarks, clockwise from top of head) ──────────
var OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,
            379,378,400,377,152,148,176,149,150,136,172,58,132,93,
            234,127,162,21,54,103,67,109];

// ── CANVAS ────────────────────────────────────────────────────────────────
var W = window.innerWidth, H = window.innerHeight;
var cv = document.getElementById('c');
cv.width = W; cv.height = H;
var ctx = cv.getContext('2d');
var FR = { x: W * 0.04, y: H * 0.04, w: W * 0.92, h: H * 0.92 };

// ── INK SETTINGS: HALFTONE NEWSPRINT ─────────────────────────────────────
//   Regular geometric grid of dots. Size = f(depth).
//   Warm cream paper, near-black ink. Dot fills cell at shadow=1.
var PAPER    = '#F2EDE3';   // warm cream newsprint
var INK      = '#1C1610';   // warm near-black
var GRID     = 7;           // halftone grid spacing (px)
var MIN_SH   = 0.045;       // skip grid cell below this shadow value
var GAMMA    = 1.10;        // power curve (>1 = sharper contrast)
var MAX_R    = 3.1;         // max dot radius at shadow=1 (≈ GRID/2.25)

// ── SHADOW DEPTH MAP ──────────────────────────────────────────────────────
//   Offscreen canvas at 1/3 scale. Each landmark paints a depth blob.
//   Blobs accumulate to form a smooth shadow field across the face.
var SC    = 3;
var BLOB_A = 0.30;          // alpha per blob (accumulates with overlap)
var BLOB_R = 13;            // blob radius on offscreen canvas
var oW = Math.ceil(W / SC), oH = Math.ceil(H / SC);
var oc = document.createElement('canvas');
oc.width = oW; oc.height = oH;
var otx = oc.getContext('2d');

// ── STATE ─────────────────────────────────────────────────────────────────
var lastLMs   = null;
var shadowData = null;   // Uint8ClampedArray from getImageData, updated in onResults
var faceBox   = { x0: FR.x, y0: FR.y, x1: FR.x + FR.w, y1: FR.y + FR.h };

// initial paper fill
ctx.fillStyle = PAPER;
ctx.fillRect(0, 0, W, H);

// ── SHADOW MAP UPDATE ─────────────────────────────────────────────────────
function updateShadowMap(lms) {
  otx.clearRect(0, 0, oW, oH);
  for (var i = 0; i < lms.length; i++) {
    var lm = lms[i];
    var sh = Math.max(0, Math.min(1, 0.5 - lm.z * 4.5));
    if (sh < 0.03) continue;
    var px = (FR.x + lm.x * FR.w) / SC;
    var py = (FR.y + lm.y * FR.h) / SC;
    var c  = Math.round(sh * 255);
    otx.fillStyle = 'rgba(' + c + ',' + c + ',' + c + ',' + BLOB_A + ')';
    otx.beginPath();
    otx.arc(px, py, BLOB_R, 0, Math.PI * 2);
    otx.fill();
  }
  // Cache pixel data so render() never calls getImageData
  shadowData = otx.getImageData(0, 0, oW, oH).data;
}

// ── CLIP TO FACE OVAL ─────────────────────────────────────────────────────
function clipOval(lms) {
  ctx.beginPath();
  for (var k = 0; k < OVAL.length; k++) {
    var lm = lms[OVAL[k]];
    var px = FR.x + lm.x * FR.w;
    var py = FR.y + lm.y * FR.h;
    k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.clip();
}

// ── RENDER HALFTONE ───────────────────────────────────────────────────────
function render(lms) {
  if (!shadowData) return;

  // Paper
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  // Clip to face silhouette
  ctx.save();
  clipOval(lms);

  // Halftone grid
  ctx.fillStyle = INK;
  var b = faceBox;
  for (var y = b.y0; y <= b.y1 + GRID; y += GRID) {
    for (var x = b.x0; x <= b.x1 + GRID; x += GRID) {
      var sx = Math.min(oW - 1, Math.round(x / SC));
      var sy = Math.min(oH - 1, Math.round(y / SC));
      var sh = shadowData[(sy * oW + sx) * 4] / 255;
      if (sh < MIN_SH) continue;
      var r = Math.pow(sh, GAMMA) * MAX_R;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
}

// ── DRAW LOOP ─────────────────────────────────────────────────────────────
function draw() {
  requestAnimationFrame(draw);
  if (lastLMs) render(lastLMs);
}
draw();

// ── MEDIAPIPE RESULTS ─────────────────────────────────────────────────────
function onResults(results) {
  var lms = results.multiFaceLandmarks && results.multiFaceLandmarks[0];
  document.getElementById('status').textContent = lms ? 'LIVE' : 'NO FACE';
  if (!lms) return;

  lastLMs = lms;

  // Compute tight face bounding box
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (var i = 0; i < lms.length; i++) {
    var px = FR.x + lms[i].x * FR.w;
    var py = FR.y + lms[i].y * FR.h;
    if (px < x0) x0 = px; if (px > x1) x1 = px;
    if (py < y0) y0 = py; if (py > y1) y1 = py;
  }
  faceBox = { x0: x0, y0: y0, x1: x1, y1: y1 };

  updateShadowMap(lms);
}

// ── MEDIAPIPE INIT ────────────────────────────────────────────────────────
var video = document.getElementById('v');
var fm = new FaceMesh({
  locateFile: function (f) {
    return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/' + f;
  }
});
fm.setOptions({
  maxNumFaces: 1, refineLandmarks: true,
  minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
});
fm.onResults(onResults);

new Camera(video, {
  onFrame: async function () { await fm.send({ image: video }); },
  width: 640, height: 480
}).start().catch(function (e) {
  document.getElementById('status').textContent = 'CAM ERR';
  console.error(e);
});

// ── SAVE ──────────────────────────────────────────────────────────────────
document.getElementById('save-btn').onclick = function () {
  var a = document.createElement('a');
  a.download = 'facial-print-halftone-' + Date.now() + '.jpg';
  a.href = cv.toDataURL('image/jpeg', 0.93);
  a.click();
};
</script>
</body>
</html>
