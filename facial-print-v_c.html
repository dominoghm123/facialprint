<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FACIAL PRINT · ENGRAVING / V_C</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FBFAF8;overflow:hidden;font-family:'Courier New',monospace}
canvas{display:block;position:fixed;top:0;left:0}
video{display:none}
#bar{
  position:fixed;bottom:20px;left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:24px;
  z-index:10;pointer-events:none}
#label{font-size:9px;letter-spacing:0.32em;color:rgba(8,8,8,0.38)}
#status{font-size:9px;letter-spacing:0.20em;color:rgba(8,8,8,0.30)}
#save-btn{
  pointer-events:auto;background:none;
  border:1px solid rgba(8,8,8,0.22);
  color:rgba(8,8,8,0.50);
  font-family:'Courier New',monospace;font-size:9px;
  letter-spacing:0.22em;padding:5px 16px;cursor:pointer;
  transition:border-color 0.2s,color 0.2s}
#save-btn:hover{border-color:rgba(8,8,8,0.72);color:rgba(8,8,8,0.86)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline autoplay muted></video>
<div id="bar">
  <span id="label">ENGRAVING · V_C</span>
  <span id="status">INIT</span>
  <button id="save-btn">SAVE</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script>
// ── FACE OVAL ─────────────────────────────────────────────────────────────
var OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,
            379,378,400,377,152,148,176,149,150,136,172,58,132,93,
            234,127,162,21,54,103,67,109];

// ── CANVAS ────────────────────────────────────────────────────────────────
var W = window.innerWidth, H = window.innerHeight;
var cv = document.getElementById('c');
cv.width = W; cv.height = H;
var ctx = cv.getContext('2d');
var FR = { x: W * 0.04, y: H * 0.04, w: W * 0.92, h: H * 0.92 };

// ── INK SETTINGS: COPPER ENGRAVING ───────────────────────────────────────
//   Precision micro-dots, pure black on near-white paper.
//   Very high dot count + tight scatter gives the fine-grain texture
//   of a copperplate or intaglio print. Strong gamma forces dots only
//   where there is real topographic depth — flat areas stay nearly blank.
var PAPER   = '#FBFAF8';         // near-white plate paper
var INK     = 'rgba(6,6,6,0.92)'; // pure black, nearly opaque
var MIN_SH  = 0.04;              // skip shallow landmarks entirely
var GAMMA   = 1.50;              // high contrast — only depth reads as ink
var MAX_R   = 2.2;               // fine micro-dots (max)
var SPREAD  = 2.0;               // tight cluster around each landmark
var MIN_CNT = 2;                 // min dots per qualifying landmark
var EXTRA   = 7;                 // extra dots proportional to shadow depth
                                 // total range: 2–9 dots per landmark

// ── DOT CACHE ─────────────────────────────────────────────────────────────
//   Fixed (ox, oy) offsets built once on first detection.
//   Render reads current landmark positions directly — zero spring lag.
var dots    = [];
var lastLMs = null;

function buildDotCache(lms) {
  dots = [];
  for (var i = 0; i < lms.length; i++) {
    var lm = lms[i];
    var sh = Math.max(0, Math.min(1, 0.5 - lm.z * 4.5));
    if (sh < MIN_SH) continue;
    var count = MIN_CNT + Math.floor(sh * EXTRA);
    for (var j = 0; j < count; j++) {
      var ro  = Math.sqrt(Math.random()) * SPREAD;
      var ang = Math.random() * Math.PI * 2;
      dots.push({ lmIdx: i, ox: Math.cos(ang) * ro, oy: Math.sin(ang) * ro });
    }
  }
}

// initial paper fill
ctx.fillStyle = PAPER;
ctx.fillRect(0, 0, W, H);

// ── CLIP TO FACE OVAL ─────────────────────────────────────────────────────
function clipOval(lms) {
  ctx.beginPath();
  for (var k = 0; k < OVAL.length; k++) {
    var lm = lms[OVAL[k]];
    var px = FR.x + lm.x * FR.w;
    var py = FR.y + lm.y * FR.h;
    k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.clip();
}

// ── RENDER ENGRAVING ──────────────────────────────────────────────────────
function render(lms) {
  // Paper
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  // Clip to face silhouette
  ctx.save();
  clipOval(lms);

  // Micro-dots — snap directly to landmark positions, no spring
  ctx.fillStyle = INK;
  for (var i = 0; i < dots.length; i++) {
    var d  = dots[i];
    var lm = lms[d.lmIdx];
    var sh = Math.max(0, Math.min(1, 0.5 - lm.z * 4.5));
    var r  = Math.pow(sh, GAMMA) * MAX_R;
    if (r < 0.18) continue;
    var x = FR.x + lm.x * FR.w + d.ox;
    var y = FR.y + lm.y * FR.h + d.oy;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// ── DRAW LOOP ─────────────────────────────────────────────────────────────
function draw() {
  requestAnimationFrame(draw);
  if (lastLMs && dots.length) render(lastLMs);
}
draw();

// ── MEDIAPIPE RESULTS ─────────────────────────────────────────────────────
function onResults(results) {
  var lms = results.multiFaceLandmarks && results.multiFaceLandmarks[0];
  document.getElementById('status').textContent = lms ? 'LIVE' : 'NO FACE';
  if (!lms) return;
  if (!dots.length) buildDotCache(lms);
  lastLMs = lms;
}

// ── MEDIAPIPE INIT ────────────────────────────────────────────────────────
var video = document.getElementById('v');
var fm = new FaceMesh({
  locateFile: function (f) {
    return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/' + f;
  }
});
fm.setOptions({
  maxNumFaces: 1, refineLandmarks: true,
  minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
});
fm.onResults(onResults);

new Camera(video, {
  onFrame: async function () { await fm.send({ image: video }); },
  width: 640, height: 480
}).start().catch(function (e) {
  document.getElementById('status').textContent = 'CAM ERR';
  console.error(e);
});

// ── SAVE ──────────────────────────────────────────────────────────────────
document.getElementById('save-btn').onclick = function () {
  var a = document.createElement('a');
  a.download = 'facial-print-engraving-' + Date.now() + '.jpg';
  a.href = cv.toDataURL('image/jpeg', 0.93);
  a.click();
};
</script>
</body>
</html>
